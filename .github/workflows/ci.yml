name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Actions are pinned to commit SHAs; Dependabot reads the version comment
    # on the same line, so those comments stay where they are.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: make install
      - run: make check
      - run: make build
      - name: No source maps in the build
        run: test -z "$(find dist -name '*.map')"
      - name: Secret scan
        run: make leaks
